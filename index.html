<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>카드통장 0원 맞추기</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f1e8}#appFrame{width:100%;height:100vh;border:0;display:block;background:#f4f1e8}
</style>
</head>
<body>
<iframe id="appFrame" src="app.html?v=20261026-type-unified" title="카드통장 0원 맞추기"></iframe>
<script>
let pdfjsPromise=null;
async function getPdfJs(){
  if(!pdfjsPromise){
    pdfjsPromise=import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs').then(mod=>{
      mod.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';
      return mod;
    }).catch(err=>{pdfjsPromise=null;throw err});
  }
  return pdfjsPromise;
}

const frame=document.getElementById('appFrame');
frame.addEventListener('load',()=>{
  const w=frame.contentWindow,d=frame.contentDocument;
  if(!w||!d)return;

  const theme=d.createElement('style');
  theme.textContent=`
  :root{--p:#2457ff!important;--pd:#1639b6!important;--line:#ded9cd!important;--bg:#f4f1e8!important;--txt:#171717!important;--muted:#6d6b65!important;--ok:#158a62!important;--warn:#ff7a00!important;--bad:#e4473b!important;--purple:#7356ff!important;--teal:#0c9e98!important;--manual:#b65500!important;--soft:#fbfaf6!important;--blue:#2457ff!important;--fs:18px;--fs-strong:22px}
  html{scroll-behavior:smooth}body{background:#f4f1e8!important;color:#171717!important;font-family:Arial,"Noto Sans KR",sans-serif!important;letter-spacing:-.02em;font-size:var(--fs)!important}
  body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 85% 10%,rgba(198,255,0,.18),transparent 26%),radial-gradient(circle at 8% 35%,rgba(36,87,255,.08),transparent 24%);z-index:-1}
  body,button,input,select,textarea,table,th,td,p,li,span,small,label,.hint,.status,.note,.meta,.checks,.legend,.muted,.field p,.modal-body,.tabs button,.filterbar button,.search,.step,.file-btn,.slot,.pick-main small,.guide-item p{font-size:var(--fs)!important}
  h1,h2,h3,h4,.brand,.workspace .card h2,.dash h2,.section h2,.guide h2,.modal-head h3,.manual-box h3,.sumitem strong,.meter-top .remain,.manual-totals strong,.pick-main strong,.guide-item h3,#causeDedicatedUpload>div:first-child,#cardDedicatedUpload>div:first-child,.eyebrow,strong{font-size:var(--fs-strong)!important}
  .topbar{background:rgba(244,241,232,.94)!important;border-bottom:1px solid #d7d0c2!important;backdrop-filter:blur(14px);padding:16px 26px!important}.logo{background:#171717!important;border-radius:50%!important;width:42px!important;height:42px!important;font-size:var(--fs)!important;box-shadow:none!important}
  .topbar button,.viewctl{border-color:#cfc8ba!important;background:#fbfaf6!important}.topbar button:hover{background:#c8ff22!important;border-color:#171717!important;color:#171717!important}
  main{width:min(1320px,calc(100% - 44px))!important;margin:34px auto 70px!important}
  main>section.panel:first-of-type{background:#c8ff22!important;border:0!important;border-radius:34px!important;padding:46px 46px 38px!important;box-shadow:none!important;position:relative;overflow:hidden}
  main>section.panel:first-of-type:after{content:"0원";position:absolute;right:28px;top:-26px;font-size:110px!important;font-weight:900;letter-spacing:-.09em;color:rgba(23,23,23,.065);line-height:1}
  h1{line-height:1.15!important;letter-spacing:-.04em!important;max-width:900px;margin:14px 0 22px!important;position:relative;z-index:1}.sub{color:#2f2e2a!important;max-width:1000px;line-height:1.65!important;position:relative;z-index:1}
  .steps{position:relative;z-index:1;margin-top:32px!important;gap:8px!important}.step{background:rgba(255,255,255,.55)!important;border:1px solid rgba(23,23,23,.16)!important;border-radius:18px!important;padding:16px!important}.step.active{background:#171717!important;color:#fff!important;border-color:#171717!important}.step.active strong{color:#c8ff22!important}.step.done{background:#fff!important;border-color:#171717!important}
  .panel,.card{background:#fffdf7!important;border:1px solid #dcd5c8!important;border-radius:28px!important;box-shadow:none!important}.workspace{gap:20px!important;margin-top:22px!important}.workspace .card{padding:28px!important;min-height:250px}
  #causeDedicatedUpload,#cardDedicatedUpload{border:2px dashed #171717!important;border-radius:22px!important;background:#f8f6ef!important;padding:30px 22px!important;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center}
  #causeDedicatedUpload:hover,#cardDedicatedUpload:hover{background:#eef0ff!important;transform:translateY(-2px)}.file-btn{background:#171717!important;color:#fff!important;border-radius:999px!important;padding:14px 24px!important;display:inline-flex!important;align-items:center!important;justify-content:center!important}.file-btn:hover{background:#2457ff!important}
  .slot{border-radius:18px!important;background:#fff!important;border-color:#e1dbcf!important}.actionbar{background:#171717!important;border:0!important;border-radius:24px!important;padding:20px 22px!important;color:#fff}.actionbar .status{color:#d8d6ce!important}.actionbar .status.ready{color:#c8ff22!important}.actionbar button{border-color:#4a4a4a!important;background:#282828!important;color:#fff!important}.actionbar button.primary{background:#c8ff22!important;border-color:#c8ff22!important;color:#171717!important}.actionbar button:hover{background:#2457ff!important;border-color:#2457ff!important;color:#fff!important}
  .dash{background:#2457ff!important;color:#fff!important;border:0!important}.dash .hint,.dash .verify span{color:#dfe5ff!important}.bar{background:rgba(255,255,255,.18)!important;height:18px!important}.sumitem{background:#fff!important;border:0!important;border-radius:18px!important;padding:18px!important}.sumitem:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.15)}
  .section{margin-top:22px!important}.review-item,.manual-box,.tablewrap{border-radius:18px!important;border-color:#ddd6c9!important}.review-cause,.manual-box h3,th{background:#f3efe6!important}table{background:#fffdf9!important}th{color:#282721!important;font-weight:800!important}th,td{padding:13px 14px!important}.filterbar button{border-radius:999px!important;background:#f4f1e8!important}.filterbar button.active{background:#171717!important;color:#fff!important;border-color:#171717!important}.search{border-radius:999px!important;background:#fff!important;padding:12px 17px!important}
  .manual-footer{background:#f8f5ed!important;border-radius:20px!important}.manual-footer .primary{background:#2457ff!important;border-color:#2457ff!important}.note{background:#fff0cd!important;border:0!important;border-radius:18px!important;color:#5d4312!important}.guide{background:#171717!important;color:#fff!important;border:0!important}.guide .guide-item{background:#242424!important;border-color:#3d3d3d!important;border-radius:22px!important}.guide .guide-item p{color:#c9c7c0!important}.guide .guide-item h3{color:#c8ff22!important}
  footer{color:#77736b!important;padding:34px!important}.modal{background:rgba(12,12,12,.58)!important;backdrop-filter:blur(8px)}.modal-box{border-radius:28px!important;background:#fffdf7!important;box-shadow:0 24px 80px rgba(0,0,0,.25)!important}.tabs button.on{background:#171717!important;color:#fff!important}.field input,.field select{padding:10px!important}
  button{transition:.18s ease;letter-spacing:-.02em}button:hover{transform:translateY(-1px)}
  @media(max-width:850px){:root{--fs:16px;--fs-strong:19px}main{width:calc(100% - 22px)!important}main>section.panel:first-of-type{padding:30px 22px!important;border-radius:24px!important}.workspace .card{padding:20px!important}.topbar{padding:12px 14px!important}main>section.panel:first-of-type:after{font-size:78px!important}}
  `;
  d.head.appendChild(theme);

  const dropAll=d.getElementById('dropAll');
  const overlay=d.getElementById('dropOverlay');
  const multiInput=d.getElementById('multiInput');
  if(dropAll)dropAll.style.display='none';
  if(overlay)overlay.style.display='none';
  if(multiInput)multiInput.disabled=true;

  const firstHint=d.getElementById('firstHint');
  if(firstHint)firstHint.innerHTML='아래에서 <b>원인행위목록</b>과 <b>카드사용내역</b>을 각각 선택해 주세요. 지원 파일: <b>PDF · XLSX · XLS</b> · 파일은 이 컴퓨터 밖으로 나가지 않습니다.';

  const follow=d.querySelector('[data-pane="follow"] ol');
  if(follow){const items=follow.querySelectorAll('li');if(items[2])items[2].innerHTML='<span class="num">3</span><b>파일을 각각 넣기</b> — 왼쪽 <b>원인행위목록 파일 선택</b>, 오른쪽 <b>카드사용내역 파일 선택</b> 버튼으로 각각 업로드하세요. 지원 형식은 <b>PDF · XLSX · XLS</b>이며 각 칸에 파일을 끌어다 놓아도 됩니다.';}

  async function pdfToExcelFile(file){
    let pdfjsLib;
    try{pdfjsLib=await getPdfJs()}catch(e){throw new Error('PDF 분석 구성요소를 불러오지 못했습니다. 기관망에서 cdnjs가 차단된 경우 XLSX 또는 XLS 파일을 사용해 주세요.')}
    const buf=await file.arrayBuffer();const pdf=await pdfjsLib.getDocument({data:buf}).promise;const allRows=[];
    for(let p=1;p<=pdf.numPages;p++){
      const page=await pdf.getPage(p),content=await page.getTextContent();
      const items=content.items.filter(x=>String(x.str||'').trim()).map(x=>({text:String(x.str).trim(),x:x.transform[4],y:x.transform[5]}));
      items.sort((a,b)=>Math.abs(b.y-a.y)>2?b.y-a.y:a.x-b.x);
      const lines=[];
      for(const it of items){let line=lines.find(r=>Math.abs(r.y-it.y)<=2.5);if(!line){line={y:it.y,items:[]};lines.push(line)}line.items.push(it)}
      lines.sort((a,b)=>b.y-a.y);
      for(const line of lines){line.items.sort((a,b)=>a.x-b.x);const row=[];let prev=null;for(const it of line.items){if(prev===null)row.push(it.text);else{const gap=it.x-prev;if(gap>28)row.push(it.text);else row[row.length-1]+=' '+it.text}prev=it.x+Math.max(8,it.text.length*5.5)}if(row.some(v=>String(v).trim()))allRows.push(row)}
    }
    if(!allRows.length)throw new Error('PDF에서 읽을 수 있는 텍스트를 찾지 못했습니다. 스캔 이미지 PDF는 지원되지 않습니다.');
    const wb=w.XLSX.utils.book_new(),ws=w.XLSX.utils.aoa_to_sheet(allRows);w.XLSX.utils.book_append_sheet(wb,ws,'PDF');const out=w.XLSX.write(wb,{bookType:'xlsx',type:'array'});return new File([out],file.name.replace(/\.pdf$/i,'')+'_PDF변환.xlsx',{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  }

  function addDedicated(kind,expected,labelText){
    const slot=d.getElementById(kind+'Slot');if(!slot||d.getElementById(kind+'DedicatedUpload'))return;const card=slot.closest('.card');if(!card)return;
    const box=d.createElement('div');box.id=kind+'DedicatedUpload';box.style.cssText='margin-top:12px;transition:.15s';box.innerHTML='<div style="font-weight:900;margin-bottom:8px">'+labelText+'</div><div style="color:#6d6b65;margin-bottom:15px">PDF · XLSX · XLS 파일을 선택하거나 이 영역에 끌어다 놓으세요</div><label class="file-btn" for="'+kind+'DedicatedInput">파일 선택</label><input id="'+kind+'DedicatedInput" type="file" accept=".pdf,.xlsx,.xls,application/pdf,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" style="display:none">';slot.parentNode.insertBefore(box,slot);
    const input=d.getElementById(kind+'DedicatedInput');
    async function useFile(file){if(!file)return;if(!/\.(pdf|xlsx|xls)$/i.test(file.name)){w.alert('PDF, XLSX 또는 XLS 파일만 선택해 주세요.');return}try{box.style.background='#eef0ff';let targetFile=file;if(/\.pdf$/i.test(file.name)){const status=d.getElementById('statusText');if(status)status.textContent='PDF 내용을 읽고 있습니다...';targetFile=await pdfToExcelFile(file)}const checked=await w.readFile(targetFile);if(checked.type!==expected){w.alert(expected==='cause'?'이 파일은 원인행위목록으로 인식되지 않습니다. 오른쪽 카드사용내역 칸에 넣어 주세요.':'이 파일은 카드사용내역으로 인식되지 않습니다. 왼쪽 원인행위목록 칸에 넣어 주세요.');input.value='';return}await w.handleFiles([targetFile]);if(/\.pdf$/i.test(file.name)){setTimeout(()=>{const nameEl=d.getElementById(kind+'Slot')?.querySelector('.file-name');if(nameEl)nameEl.textContent=file.name+' (PDF 분석)'},0)}input.value=''}catch(e){w.alert('파일을 읽지 못했습니다: '+(e&&e.message?e.message:e))}finally{box.style.background='#f8f6ef'}}
    input.addEventListener('change',e=>useFile(e.target.files[0]));
    ['dragenter','dragover'].forEach(ev=>box.addEventListener(ev,e=>{e.preventDefault();e.stopPropagation();box.style.background='#eef0ff'}));
    ['dragleave','drop'].forEach(ev=>box.addEventListener(ev,e=>{e.preventDefault();e.stopPropagation();box.style.background='#f8f6ef'}));
    box.addEventListener('drop',e=>useFile(e.dataTransfer.files[0]));
  }

  addDedicated('cause','cause','원인행위목록 업로드');
  addDedicated('card','card','카드사용내역 업로드');
  const workspace=d.querySelector('.workspace');
  if(workspace){const cards=workspace.querySelectorAll('.card');if(cards[0]){const p=cards[0].querySelector('.hint');if(p)p.textContent='K-에듀파인 원인행위(지급방법-카드) 목록 · PDF, XLSX, XLS';}if(cards[1]){const p=cards[1].querySelector('.hint');if(p)p.textContent='카드사 승인내역(전체승인) · PDF, XLSX, XLS';}}
});
</script>
</body>
</html>
